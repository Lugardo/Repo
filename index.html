<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>En mantenimiento</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      color: #ffffff;
    }

    body {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(130deg, #050f2c 0%, #0a1f44 20%, #1e3a8a 45%, #2563eb 70%, #3b82f6 100%);
      background-size: 300% 300%;
      animation: gradientShift 14s ease-in-out infinite;
    }

    @keyframes gradientShift {
      0%   { background-position: 0% 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Floating blurred particles for depth */
    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(60px);
      opacity: 0.55;
      pointer-events: none;
      will-change: transform;
    }
    .blob.b1 { width: 420px; height: 420px; background: #60a5fa; top: -120px; left: -120px; animation: drift1 18s ease-in-out infinite; }
    .blob.b2 { width: 360px; height: 360px; background: #22d3ee; bottom: -140px; right: -100px; animation: drift2 22s ease-in-out infinite; }
    .blob.b3 { width: 280px; height: 280px; background: #818cf8; top: 40%; right: 15%; animation: drift3 26s ease-in-out infinite; }

    @keyframes drift1 {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50%      { transform: translate(80px, 60px) scale(1.15); }
    }
    @keyframes drift2 {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50%      { transform: translate(-100px, -70px) scale(1.1); }
    }
    @keyframes drift3 {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50%      { transform: translate(-60px, 90px) scale(0.9); }
    }

    main {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 2rem;
      max-width: 1100px;
    }

    .gear {
      width: clamp(90px, 14vw, 160px);
      height: auto;
      margin: 0 auto 1.5rem;
      display: block;
      filter: drop-shadow(0 0 24px rgba(96, 165, 250, 0.85));
      animation: spin 9s linear infinite;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    h1 {
      font-size: clamp(2.25rem, 8vw, 6rem);
      font-weight: 900;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      line-height: 1.05;
      background: linear-gradient(90deg, #ffffff 0%, #bfdbfe 45%, #ffffff 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 40px rgba(147, 197, 253, 0.35);
      animation: pulse 2.8s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { filter: drop-shadow(0 0 12px rgba(191, 219, 254, 0.55)); transform: scale(1); }
      50%      { filter: drop-shadow(0 0 32px rgba(147, 197, 253, 0.95)); transform: scale(1.015); }
    }

    .subtitle {
      margin-top: 1.25rem;
      font-size: clamp(1rem, 2.2vw, 1.5rem);
      font-weight: 400;
      color: #dbeafe;
      letter-spacing: 0.04em;
      opacity: 0.95;
    }

    .dots {
      display: inline-block;
      width: 1.5em;
      text-align: left;
    }
    .dots span {
      opacity: 0;
      animation: dotFade 1.6s infinite;
    }
    .dots span:nth-child(2) { animation-delay: 0.25s; }
    .dots span:nth-child(3) { animation-delay: 0.5s; }

    @keyframes dotFade {
      0%, 80%, 100% { opacity: 0; }
      40%           { opacity: 1; }
    }

    .badge {
      display: inline-block;
      margin-top: 2rem;
      padding: 0.6rem 1.4rem;
      border: 1px solid rgba(191, 219, 254, 0.5);
      border-radius: 999px;
      font-size: clamp(0.8rem, 1.6vw, 1rem);
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #e0f2fe;
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(6px);
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <div class="blob b1" aria-hidden="true"></div>
  <div class="blob b2" aria-hidden="true"></div>
  <div class="blob b3" aria-hidden="true"></div>

  <main>
    <svg class="gear" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <defs>
        <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#e0f2fe"/>
          <stop offset="100%" stop-color="#60a5fa"/>
        </linearGradient>
      </defs>
      <path fill="url(#g)" d="M50 8l5.5 8.4a34 34 0 0 1 8.3 2.2l9.5-3.3 5.4 9.3-6.9 7a34 34 0 0 1 3.1 7.9l9.8 2.5v10.8l-9.8 2.5a34 34 0 0 1-3.1 7.9l6.9 7-5.4 9.3-9.5-3.3a34 34 0 0 1-8.3 2.2L50 92l-5.5-8.4a34 34 0 0 1-8.3-2.2l-9.5 3.3-5.4-9.3 6.9-7a34 34 0 0 1-3.1-7.9L15.3 58V47.2l9.8-2.5a34 34 0 0 1 3.1-7.9l-6.9-7 5.4-9.3 9.5 3.3a34 34 0 0 1 8.3-2.2L50 8z"/>
      <circle cx="50" cy="52.6" r="13" fill="#0a1f44"/>
    </svg>

    <h1>En mantenimiento</h1>
    <p class="subtitle">
      Estamos trabajando para volver pronto<span class="dots"><span>.</span><span>.</span><span>.</span></span>
    </p>
    <span class="badge">Gracias por tu paciencia</span>
  </main>
</body>
</html>
